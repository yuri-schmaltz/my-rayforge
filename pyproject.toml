[project]
name = "pires-forge"
dynamic = ["version"]
dependencies = []
authors = [
  { name="Yuri Schmaltz", email="security@yuri-schmaltz.dev" },
]
description = "A desktop application for laser cutting and engraving"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Manufacturing",
]

[project.urls]
"Homepage" = "https://github.com/yuri-schmaltz/pires-forge"
"Bug Tracker" = "https://github.com/yuri-schmaltz/pires-forge/issues"

[project.gui-scripts]
pires-forge = "rayforge.app:main"

[build-system]
requires = [
  "setuptools >= 40.9.0", "setuptools-git-versioning"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rayforge*"]

[tool.setuptools-git-versioning]
enabled = false

[tool.ruff]
lint = { ignore = ["E203"] }
builtins = ["_"]
line-length = 79

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
stubPath = "typings"
reportMissingModuleSource = false
include = [
    "rayforge",
    "tests/**/*.py",
    "rayforge/builtin_addons/*",
    "rayforge/private_addons/*",
]

[tool.mypy]
mypy_path = "stubs"

[tool.setuptools.data-files]
"share/applications" = ["data/org.piresforge.pires-forge.desktop"]
"share/metainfo" = ["data/org.piresforge.pires-forge.metainfo.xml"]
"share/mime/packages" = ["data/org.piresforge.pires-forge.xml"]
"share/icons/hicolor/scalable/apps" = ["rayforge/resources/icons/org.piresforge.pires-forge.svg"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov", # Add coverage tool
    "pygobject-stubs",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Ignore Swig related deprecation warnings from importlib
    "ignore::DeprecationWarning:importlib._bootstrap",
]
testpaths = [
    "tests",
    "rayforge/builtin_addons/*/tests",
    "rayforge/private_addons/*/tests",
]
norecursedirs = [
    "builddir",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".pixi",
    "__pycache__",
]
markers = [
    "ui: marks tests as UI tests that require a graphical environment and a real GTK event loop",
    "stress: marks tests as stress tests that run for extended periods",
]
addopts = "-m 'not ui and not stress'"

# --------------------------------------------------------------------------
# Coverage configuration (pytest-cov)
# --------------------------------------------------------------------------
# Run with: ``pixi run pytest --cov=rayforge --cov-report=term-missing``
# or via the dedicated pixi task: ``pixi run coverage``.
#
# The coverage gate in ``.github/workflows/lint-test.yml`` (job
# ``coverage``) fails the build if the line coverage drops below
# ``fail_under`` for the ``rayforge`` package. The threshold is
# intentionally set conservatively; bump it as the suite matures.
[tool.coverage.run]
branch = true
source = ["rayforge"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.pixi/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
# Fail the build if total line coverage drops below this threshold.
# Measured on the ``rayforge`` package (excludes the built-in addons,
# which are tested by the ``addon-test`` pixi task).
fail_under = 35
# Show "missing" lines for files with <100% coverage. The CI job
# uses ``--cov-report=term-missing`` so this is informational.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
