name: Quality checks (i18n + a11y + coverage)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

# Permissions: read-only. Closes CodeQL alert.
permissions:
  contents: read

jobs:
  i18n:
    name: i18n audit + extract check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Install pires-forge (no deps for audit)
        run: |
          pip install --quiet --break-system-packages \
            pyyaml

      - name: i18n audit (no new unwrapped strings)
        run: |
          python3 -m rayforge.util.i18n_audit --format json \
            > /tmp/i18n-audit.json
          if [ -s /tmp/i18n-audit.json ]; then
            echo "::error::i18n audit found candidates"
            cat /tmp/i18n-audit.json
            exit 1
          fi
          echo "OK: 0 i18n candidates"

  a11y-contrast:
    name: WCAG contrast check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install --quiet --break-system-packages pyyaml
      - name: Contrast check
        run: python3 -m rayforge.util.contrast_check

  i18n-extract:
    name: i18n .pot unchanged
    # Runs after i18n audit. If audit passed, then the
    # new strings are wrapped; the .pot must reflect that.
    needs: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install gettext
        run: sudo apt-get install -y gettext
      - name: Install pyyaml
        run: pip install --quiet --break-system-packages pyyaml
      - name: Extract + check
        run: python3 -m rayforge.util.i18n_extract --check

  coverage:
    name: Coverage gate (≥ 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
      - name: Run tests with coverage
        run: |
          pixi run pytest --cov=rayforge --cov-report=json \
            -q tests/ > /dev/null
      - name: Coverage gate
        run: |
          pixi run python -m rayforge.util.coverage_gate \
            --per-file
        env:
          PIRES_FORGE_MIN_COVERAGE: "70"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
          retention-days: 30

  property-tests:
    name: Property-based tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install --quiet --break-system-packages pyyaml
      - name: Run property tests
        run: PYTHONPATH=. python3 tests/property/__init__.py

  smoke-import:
    name: Smoke import (no display)
    # Catches ImportError regressions at the package
    # level, which the other gates can't see (they all
    # run as scripts, not as the installed package).
    # This is what would have caught the v1.3.0 bug
    # (missing `_` alias in localized.py) and the
    # v1.3.1 bug (set_skip_taskbar_hint removed in
    # GTK 4) before they shipped.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
      - name: Install system dependencies (gi, cairo, gtk4)
        # Required for gi.repository.Gtk; pixi.toml lists
        # them but apt is faster than building them.
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 libgtk-4-1 libcairo2
      - name: Install pires-forge
        run: |
          pixi run pip install --quiet --break-system-packages \
            -e .
      - name: Smoke import the main package
        # This triggers the same import chain as
        # `pires-forge` startup. Any ImportError (e.g.
        # missing `_` alias, removed GTK 3 method) is
        # caught here.
        run: |
          python3 -c "import rayforge; from rayforge.ui_gtk.splash import SplashScreen; print('imports OK')"
      - name: Smoke import the dockable modules
        # Catches missing exports in the dockable
        # modules (PR #77-#79 + #80) before they ship.
        run: |
          python3 -c "from rayforge.ui_gtk.drag_controller import DragController; from rayforge.ui_gtk.workspace import Workspace; print('dockable imports OK')"
