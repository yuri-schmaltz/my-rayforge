name: Quality checks (i18n + a11y + coverage)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

# Permissions: read-only. Closes CodeQL alert.
permissions:
  contents: read

jobs:
  i18n:
    name: i18n audit + extract check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Install pires-forge (no deps for audit)
        run: |
          pip install --quiet --break-system-packages \
            pyyaml

      - name: i18n audit (no new unwrapped strings)
        run: |
          python3 -m rayforge.util.i18n_audit --format json \
            > /tmp/i18n-audit.json
          if [ -s /tmp/i18n-audit.json ]; then
            echo "::error::i18n audit found candidates"
            cat /tmp/i18n-audit.json
            exit 1
          fi
          echo "OK: 0 i18n candidates"

  a11y-contrast:
    name: WCAG contrast check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install --quiet --break-system-packages pyyaml
      - name: Contrast check
        run: python3 -m rayforge.util.contrast_check

  i18n-extract:
    name: i18n .pot unchanged
    # Runs after i18n audit. If audit passed, then the
    # new strings are wrapped; the .pot must reflect that.
    needs: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install gettext
        run: sudo apt-get install -y gettext
      - name: Install pyyaml
        run: pip install --quiet --break-system-packages pyyaml
      - name: Extract + check
        run: python3 -m rayforge.util.i18n_extract --check

  coverage:
    name: Coverage gate (≥ 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
      - name: Run tests with coverage
        run: |
          pixi run pytest --cov=rayforge --cov-report=json \
            -q tests/ > /dev/null
      - name: Coverage gate
        run: |
          pixi run python -m rayforge.util.coverage_gate \
            --per-file
        env:
          PIRES_FORGE_MIN_COVERAGE: "70"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.json
          retention-days: 30

  property-tests:
    name: Property-based tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install --quiet --break-system-packages pyyaml
      - name: Run property tests
        run: PYTHONPATH=. python3 tests/property/__init__.py

  smoke-import:
    name: Smoke import + GTK 4 instantiate
    # Catches ImportError regressions at the package
    # level AND GTK 3->4 method removals that only
    # fire at object construction. The other gates
    # can't see either class of bug (they all run as
    # scripts, not as the installed package, and
    # don't construct the GTK 4 widgets).
    #
    # This is what would have caught:
    #   - v1.3.0 bug: missing `_` alias in localized.py
    #     (ImportError, caught by "imports OK" step)
    #   - v1.3.1 bug: set_skip_taskbar_hint removed in
    #     GTK 4 (AttributeError on SplashScreen.__init__,
    #     caught by the "instantiate" step)
    #   - v1.3.2 bug: set_focus_on_map removed in GTK 4
    #     (AttributeError on SplashScreen.__init__,
    #     caught by the "instantiate" step)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
      - name: Install system dependencies (gi, cairo, gtk4, xvfb)
        # Required for gi.repository.Gtk and the
        # headless X server. pixi.toml lists the gi
        # stack but apt is faster than building it.
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 libgtk-4-1 libcairo2 \
            xvfb
      - name: Install pires-forge
        run: |
          pixi run pip install --quiet --break-system-packages \
            -e .
      - name: Smoke import the main package
        # Triggers the same import chain as
        # `pires-forge` startup. Catches ImportError
        # (e.g. missing `_` alias).
        run: |
          python3 -c "import rayforge; from rayforge.ui_gtk.splash import SplashScreen; print('imports OK')"
      - name: Smoke instantiate SplashScreen under Xvfb
        # Catches AttributeError from GTK 3->4
        # method removals that only fire when the
        # widget is actually constructed. This is
        # what would have caught the v1.3.1 +
        # v1.3.2 bugs.
        #
        # Note: we don't show() the window (that
        # would require a real display). Just
        # calling the constructor exercises every
        # method call in SplashScreen.__init__.
        run: |
          xvfb-run -a python3 -c "
          from rayforge.ui_gtk.splash import SplashScreen
          s = SplashScreen()
          print('SplashScreen instantiated OK')
          s.destroy()
          "
