name: Build .deb package

# Fork-friendly version of publish-deb.yml: builds the Ubuntu 24.04 .deb
# and uploads it as a workflow artifact. Does NOT publish to Launchpad PPA
# (the upstream barebaric/rayforge owns that account).
#
# Triggers:
#   - push to main
#   - any tag
#   - workflow_dispatch (manual)
#
# Output:
#   - artifact named `rayforge-$VERSION-ubuntu24.04.deb`

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build .deb for Ubuntu 24.04 (noble)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential
          cargo
          cython3
          devscripts
          debhelper
          dh-python
          equivs
          jq
          python3-all
          python3-maturin
          python3-numpy
          pybuild-plugin-pyproject
          python3-pip
          python3-poetry-core
          python3-pyclipper
          pkg-config
          rsync
          rustc

      - name: Compile .po -> .mo translations
        # CRITICAL: gettext at runtime reads .mo (machine object) files, NOT
        # .po (portable object) files. The .mo files are gitignored and must
        # be compiled just before the .deb is built; otherwise the .deb ships
        # with no translations (only .po files, which are for translators).
        # Fixes the "I selected Portuguese but the UI is still in English" bug.
        # Uses the pure-Python po_compiler (no gettext dependency) because
        # Ubuntu 24.04 ships gettext 0.21 which is older than the version
        # required by update_translations.sh (0.25+).
        run: >-
          python3 scripts/compile_translations.py

      - name: Set Version
        id: set-version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref_name }}
          elif git describe --tags >/dev/null 2>&1; then
            VERSION=$(git describe --tags)
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          if [ -z "$VERSION" ]; then
            echo "Error: No git version number found!"
            exit 1
          fi
          # Strip the g<sha> suffix from `git describe` (we want a clean
          # version for the .deb filename, not the snapshot revision).
          CLEAN_VERSION=$(echo "$VERSION" | sed -E 's/-[0-9]+-g[0-9a-f]+$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Raw version: $VERSION"
          echo "Clean version: $CLEAN_VERSION"

      - name: Build .deb package
        id: build_deb
        env:
          TARGET_DISTRIBUTION: noble
        run: |
          # Clean any leftover .deb from previous CI runs to prevent the
          # verify step below from checking a stale artifact.
          rm -rf dist/
          chmod +x ./scripts/build-deb.sh
          ./scripts/build-deb.sh --source

          DEB_FILE_PATH=$(find dist -name "*.deb" -type f | head -n 1)
          if [ -z "$DEB_FILE_PATH" ]; then
            echo "::error::Build failed, no .deb file found in dist/."
            exit 1
          fi
          DEB_FILENAME=$(basename "$DEB_FILE_PATH")
          echo "Built: $DEB_FILE_PATH"

          # Rename to a friendlier filename for the artifact.
          FRIENDLY_NAME="pires-forge-${CLEAN_VERSION}-ubuntu24.04.deb"
          cp "$DEB_FILE_PATH" "dist/$FRIENDLY_NAME"
          echo "Friendly name: $FRIENDLY_NAME"
          echo "deb_file_path=dist/$FRIENDLY_NAME" >> $GITHUB_OUTPUT
          echo "deb_filename=$FRIENDLY_NAME" >> $GITHUB_OUTPUT

      - name: Verify .mo translation files are in the .deb
        # Guard against regressions: gettext at runtime reads .mo (machine
        # object) files, not .po (portable object) files. If the build ever
        # stops compiling .po -> .mo, language switching silently breaks.
        # Fails the job if any supported language is missing its .mo file.
        run: |
          DEB_FILE="${{ steps.build_deb.outputs.deb_file_path }}"
          echo "Verifying .mo files in $DEB_FILE..."
          TMPDIR=$(mktemp -d)
          (cd "$TMPDIR" && ar x "$OLDPWD/$DEB_FILE")
          mkdir -p "$TMPDIR/data"
          tar -xf "$TMPDIR/data.tar."* -C "$TMPDIR/data/"
          MISSING=0
          for LANG in de en es fr pt uk zh_CN; do
            # Skip the English source-only directory; it has a .po but no .mo
            # (translations fall back to msgid, which is the English source).
            if [ "$LANG" = "en" ]; then
              # Just confirm the .po is there; the .mo is intentionally absent.
              if ! find "$TMPDIR/data" -path "*/rayforge/locale/en/LC_MESSAGES/rayforge.po" | grep -q .; then
                echo "::error::Missing en/LC_MESSAGES/rayforge.po"
                MISSING=$((MISSING + 1))
              fi
              continue
            fi
            # Main app .mo
            if ! find "$TMPDIR/data" -path "*/rayforge/locale/${LANG}/LC_MESSAGES/rayforge.mo" | grep -q .; then
              echo "::error::Missing main rayforge/locale/${LANG}/LC_MESSAGES/rayforge.mo"
              MISSING=$((MISSING + 1))
            fi
            # Built-in addon .mo files
            for addon in laser post print-and-cut sketcher; do
              addon_name=$(ls "$TMPDIR/data/usr/lib/python3/dist-packages/rayforge/builtin_addons/" 2>/dev/null | grep "rayforge-addon-${addon}\$" | head -1)
              [ -z "$addon_name" ] && continue
              if ! find "$TMPDIR/data" -path "*/${addon_name}/locale/${LANG}/LC_MESSAGES/*.mo" | grep -q .; then
                echo "::error::Missing ${addon_name}/locale/${LANG}/LC_MESSAGES/*.mo"
                MISSING=$((MISSING + 1))
              fi
            done
          done
          rm -rf "$TMPDIR"
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} .mo file(s) missing from .deb - translations won't work!"
            exit 1
          fi
          echo "All .mo files present."

      - name: Install runtime dependencies for testing
        run: |
          sudo mk-build-deps --install --tool="apt-get -y" debian/control

      - name: Test package installation
        run: |
          DEB_FILE="${{ steps.build_deb.outputs.deb_file_path }}"
          sudo apt-get install -y "./$DEB_FILE"
          dpkg -l pires-forge
          pires-forge --version

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_deb.outputs.deb_filename }}
          path: ${{ steps.build_deb.outputs.deb_file_path }}
          if-no-files-found: error
          compression-level: 9
