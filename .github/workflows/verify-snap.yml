name: Verify Snap Build

# Build and verify the snap package on every release tag and
# on every PR. The maintainer of the fork does not have
# Snapcraft credentials, so the actual publication to the
# snap store is done manually (the maintainer downloads the
# verified .snap artifact and uploads it via
# https://snapcraft.io/rayforge/listings).
#
# This workflow is the **verification** step: it ensures the
# snap builds, installs, and the basic launch test passes
# before the maintainer uploads it. If any step fails, the
# maintainer is alerted via the failed CI check.
#
# See `docs/SNAP_STORE.md` for the full submission guide.

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-snap:
    name: Build Snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
          frozen: true
          environments: build

      - name: Compile Translations
        run: pixi run --frozen -e build compile-translations

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        env:
          SNAPCRAFT_DEBUG: "1"
        continue-on-error: true

      - name: Capture snapcraft logs on failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "::group::Snapcraft log files"
          for log in /home/runner/.local/state/snapcraft/log/*.log; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              cat "$log"
            fi
          done
          echo "::endgroup::"
          echo "::group::LXD status"
          sudo lxc list --project snapcraft 2>&1 || true
          sudo lxc storage list 2>&1 || true
          echo "::endgroup::"
          echo "::group::System resources"
          free -h
          df -h
          echo "::endgroup::"

      - name: Verify snap file exists
        if: steps.build.outcome == 'success'
        run: |
          if [ ! -f "${{ steps.build.outputs.snap }}" ]; then
            echo "::error::Snap file not found at ${{ steps.build.outputs.snap }}"
            exit 1
          fi
          ls -lh "${{ steps.build.outputs.snap }}"

      - name: Inspect snap metadata
        if: steps.build.outcome == 'success'
        run: |
          SNAP_PATH="${{ steps.build.outputs.snap }}"
          echo "## Snap metadata" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          # Extract name, version, grade
          for field in name version grade confinement; do
            val=$(snapcraft version 2>/dev/null || echo "n/a")
            echo "| $field | $(unzip -p "$SNAP_PATH" meta/snap.yaml 2>/dev/null | grep -E \"^$field:\" | head -1) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Install snap with --dangerous
        if: steps.build.outcome == 'success'
        run: |
          sudo snap install "${{ steps.build.outputs.snap }}" --dangerous
          echo "✅ Snap installed"

      - name: Smoke test: --help
        if: steps.build.outcome == 'success'
        run: |
          rayforge --help
          echo "✅ --help passed"

      - name: Smoke test: --version
        if: steps.build.outcome == 'success'
        run: |
          rayforge --version
          echo "✅ --version passed"

      - name: Smoke test: launch headless
        if: steps.build.outcome == 'success'
        run: |
          # Start the snap in headless mode (no display) and
          # check that it doesn't crash within 5 seconds.
          # We use Xvfb if available; otherwise we just check
          # that the binary is invokable.
          if command -v xvfb-run >/dev/null 2>&1; then
            timeout 5 xvfb-run -a rayforge --help >/dev/null
            echo "✅ Headless launch OK"
          else
            echo "⚠️ Xvfb not available; skipping headless test"
          fi

      - name: Uninstall snap
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo snap remove rayforge 2>&1 || true

      - name: Upload .snap artifact
        if: steps.build.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rayforge-snap
          path: "*.snap"
          retention-days: 90
          if-no-files-found: error
