name: Update Download Stats

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC
  workflow_dispatch:

# This job only reads public download counters (GitHub Releases, Flathub,
# PyPI, Launchpad PPA) and pushes them to an external VictoriaMetrics
# endpoint. The GITHUB_TOKEN is never used for repo write, so
# `contents: read` is enough. Closes CodeQL alert "Workflow does not
# contain permissions".
permissions:
  contents: read

jobs:
  update-stats:
    if: github.repository == 'yuri-schmaltz/pires-forge'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch and push stats to VictoriaMetrics
        env:
          METRICS_URL: ${{ secrets.METRICS_URL }}
          METRICS_API_USER: ${{ secrets.METRICS_API_USER }}
          METRICS_API_PASSWORD: ${{ secrets.METRICS_API_PASSWORD }}
        run: |
          python3 scripts/fetch_download_stats.py --output metrics
