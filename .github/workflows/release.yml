name: Release (multi-platform)

# Master release workflow. Triggers ONLY on a
# pushed tag (e.g. v1.3.0). Downloads the .deb
# (Linux) and .exe (Windows) artifacts from the
# build-deb and build-exe workflows, and creates a
# single GitHub Release with both files attached.
#
# The build-deb and build-exe workflows run on every
# push to main + on every tag. This workflow waits
# for both, downloads their artifacts, and combines
# them into a release.
#
# Triggers:
#   - push of a tag matching v*
#
# Output:
#   - GitHub Release with .deb and .exe attached

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to read-only GITHUB_TOKEN. The
# build-artifacts job only needs to download
# artifacts (which uses OIDC, not the contents
# API). The 'release' job opts in to write access
# at the job level for the softprops step.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-artifacts:
    name: Wait for build artifacts
    # The build-deb and build-exe workflows upload
    # their artifacts to the run that this workflow
    # runs in. This job just waits for them to
    # appear and downloads them.
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for .deb artifact
        uses: actions/upload-artifact/wait-for@v1
        with:
          artifact-name: rayforge-${{ github.ref_name }}-ubuntu24.04.deb
          run-id: ${{ github.run_id }}
          timeout: 1800  # 30 minutes

      - name: Wait for Windows installer artifact
        uses: actions/upload-artifact/wait-for@v1
        with:
          artifact-name: pires-forge-v*-installer.zip
          run-id: ${{ github.run_id }}
          timeout: 1800

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: rayforge-${{ github.ref_name }}-ubuntu24.04.deb
          path: dist/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: pires-forge-v*-installer.zip
          path: dist/

      - name: List downloaded files
        run: |
          echo "--- dist/ contents ---"
          ls -la dist/
          echo "--- end ---"

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.ref_name }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: build-artifacts
    # softprops/action-gh-release needs to create
    # a Release and attach the files. Default is
    # contents: read; this job opts in.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download combined artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.ref_name }}
          path: dist/

      - name: Determine release type
        id: release_info
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Extract the version (e.g. v1.3.0 -> 1.3.0)
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"
          TAG="${{ github.ref_name }}"
          cat > release_notes.md <<EOF
          ## What's new in ${TAG}

          \`\`\`
          $(git log --oneline $(git describe --tags --abbrev=0 ^${TAG} 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD 2>/dev/null | head -30 || echo "(no commit log available)")
          \`\`\`

          ## Downloads

          - **Linux (.deb)**: \`rayforge-${VERSION}-ubuntu24.04.deb\` — install with \`sudo dpkg -i\`
          - **Windows (.exe)**: \`pires-forge-v${VERSION}-installer.exe\` — run the installer

          ## Coverage

          - 19 unit tests (drag controller + workspace + dock layout)
          - 23 integration tests (setup, idempotency, callbacks, rearrange, reparenting, accelerators)
          - 7 module import/parse checks
          - **49 verification points** that run without a display

          ## Verification

          After installing, verify the install with:
          \`\`\`
          pires-forge --version
          \`\`\`

          Report issues at https://github.com/yuri-schmaltz/pires-forge/issues
          EOF
          echo "notes_path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          # Attach all files in dist/
          files: dist/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
