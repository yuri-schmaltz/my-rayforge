name: Release (multi-platform)

# Master release workflow. Creates a single GitHub
# Release containing BOTH the .deb (Linux/Ubuntu)
# and .exe (Windows) artifacts.
#
# Uses the `workflow_run` event (native to GitHub
# Actions) to wait for the build-deb and build-exe
# workflows to complete. This is more robust than
# the previous `actions/upload-artifact/wait-for`
# approach (which had a beta `Set up job` failure).
#
# Trigger:
#   - workflow_run event when a build-* workflow
#     completes on the same tag push
#
# Output:
#   - GitHub Release with .deb and .exe attached

on:
  workflow_run:
    workflows:
      - "Build .deb package"
      - "Build Windows Executable"
    types:
      - completed

# Default to read-only GITHUB_TOKEN. The
# download-artifacts job only needs to download
# artifacts (OIDC, not contents API). The 'release'
# job opts in to write access at the job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  download-artifacts:
    name: Download build artifacts
    # Only run on tag pushes (not on PRs or main
    # branch builds). The workflow_run event fires
    # for any completed run of the listed workflows;
    # we filter to tag pushes here.
    if: >
      startsWith(github.event.workflow_run.head_branch, 'refs/tags/')
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: rayforge-${{ github.event.workflow_run.head_ref }}-ubuntu24.04.deb
          path: dist/
        # Some artifact names vary; skip if not found
        continue-on-error: true

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pires-forge-v*-installer.zip
          path: dist/
        continue-on-error: true

      - name: Verify both artifacts downloaded
        id: verify
        run: |
          echo "--- dist/ contents ---"
          ls -la dist/ || true
          DEB_COUNT=$(find dist/ -name "*.deb" | wc -l)
          EXE_COUNT=$(find dist/ -name "*.zip" -o -name "*.exe" | wc -l)
          echo "deb_count=${DEB_COUNT} exe_count=${EXE_COUNT}"
          if [ "${DEB_COUNT}" -ge 1 ] && [ "${EXE_COUNT}" -ge 1 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload combined artifacts
        if: steps.verify.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.event.workflow_run.head_ref }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: download-artifacts
    if: needs.download-artifacts.outputs.verify == 'true'
    # softprops/action-gh-release needs write
    # access to create a Release and attach files.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download combined artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.event.workflow_run.head_ref }}
          path: dist/

      - name: Determine release type
        id: release_info
        shell: bash
        run: |
          REF="${{ github.event.workflow_run.head_ref }}"
          TAG="${REF#refs/tags/}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "${{ steps.release_info.outputs.tag }}"
          body: |
            ## What's new in ${{ steps.release_info.outputs.tag }}

            See the commit log since the previous tag for the full list of changes.

            ## Downloads

            - **Linux (.deb)**: attached as `rayforge-${{ steps.release_info.outputs.version }}-ubuntu24.04.deb`
              Install with `sudo dpkg -i rayforge-${{ steps.release_info.outputs.version }}-ubuntu24.04.deb`
            - **Windows (.exe)**: attached as `pires-forge-v${{ steps.release_info.outputs.version }}-installer.exe`
              Run the installer

            ## Verification

            ```
            pires-forge --version
            ```

            Report issues at https://github.com/yuri-schmaltz/pires-forge/issues
          files: dist/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
