name: Release (multi-platform)

# Master release workflow. Creates a single GitHub
# Release containing BOTH the .deb (Linux/Ubuntu)
# and .exe (Windows) artifacts.
#
# Uses the `workflow_run` event (native to GitHub
# Actions) to wait for the build-deb and build-exe
# workflows to complete. This is more robust than
# the previous `actions/upload-artifact/wait-for`
# approach (which had a beta `Set up job` failure).
#
# Trigger:
#   - workflow_run event when a build-* workflow
#     completes on the same tag push
#
# Output:
#   - GitHub Release with .deb and .exe attached

on:
  workflow_run:
    workflows:
      - "Build .deb package"
      - "Build Windows Executable"
    types:
      - completed

# Default to read-only GITHUB_TOKEN. The
# download-artifacts job only needs to download
# artifacts (OIDC, not contents API). The 'release'
# job opts in to write access at the job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  download-artifacts:
    name: Download build artifacts
    # Only run on push events that were a tag push.
    # The workflow_run event doesn't directly tell
    # us if the original push was a tag push, so we
    # check by:
    # 1. event == 'push' (vs pull_request)
    # 2. conclusion == 'success'
    # 3. The head_sha has a tag pointing to it
    #    (we look this up via git API in a step
    #    below, not in the if condition, because
    #    if conditions can only use github.* vars)
    if: >
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check if head_sha has a tag (release)
        id: check_tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Checking tags for SHA: ${SHA}"
          TAGS=$(gh api \
            "repos/${{ github.repository }}/git/refs/tags" \
            --jq ".[] | select(.object.sha == \"${SHA}\") | .ref" \
            2>/dev/null || echo "")
          if [ -z "${TAGS}" ]; then
            echo "No tag found for ${SHA}; skipping release"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            TAG=$(echo "${TAGS}" | head -1 | sed 's|refs/tags/||')
            echo "Found tag: ${TAG}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            VERSION="${TAG#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if not a release tag
        if: steps.check_tag.outputs.is_release != 'true'
        run: |
          echo "Not a release tag; skipping download"

      - name: Download .deb artifact
        if: steps.check_tag.outputs.is_release == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: rayforge-${{ steps.check_tag.outputs.tag }}-ubuntu24.04.deb
          path: dist/
        continue-on-error: true

      - name: Download Windows installer
        if: steps.check_tag.outputs.is_release == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pires-forge-v*-installer.zip
          path: dist/
        continue-on-error: true

      - name: Verify both artifacts downloaded
        if: steps.check_tag.outputs.is_release == 'true'
        id: verify
        run: |
          echo "--- dist/ contents ---"
          ls -la dist/ || true
          DEB_COUNT=$(find dist/ -name "*.deb" 2>/dev/null | wc -l)
          EXE_COUNT=$(find dist/ -name "*.zip" -o -name "*.exe" 2>/dev/null | wc -l)
          echo "deb_count=${DEB_COUNT} exe_count=${EXE_COUNT}"
          if [ "${DEB_COUNT}" -ge 1 ] && [ "${EXE_COUNT}" -ge 1 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload combined artifacts
        if: steps.check_tag.outputs.is_release == 'true' && steps.verify.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.check_tag.outputs.tag }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: download-artifacts
    if: needs.download-artifacts.outputs.ready == 'true'
    # softprops/action-gh-release needs write
    # access to create a Release and attach files.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download combined artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.download-artifacts.outputs.tag }}
          path: dist/

      - name: Determine release type
        id: release_info
        shell: bash
        run: |
          TAG="${{ needs.download-artifacts.outputs.tag }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.download-artifacts.outputs.tag }}
          name: "${{ needs.download-artifacts.outputs.tag }}"
          body: |
            ## What's new in ${{ needs.download-artifacts.outputs.tag }}

            See the commit log since the previous tag for the full list of changes.

            ## Downloads

            - **Linux (.deb)**: attached as `rayforge-${{ steps.release_info.outputs.version }}-ubuntu24.04.deb`
              Install with `sudo dpkg -i rayforge-${{ steps.release_info.outputs.version }}-ubuntu24.04.deb`
            - **Windows (.exe)**: attached as `pires-forge-v${{ steps.release_info.outputs.version }}-installer.exe`
              Run the installer

            ## Verification

            ```
            pires-forge --version
            ```

            Report issues at https://github.com/yuri-schmaltz/pires-forge/issues
          files: dist/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
