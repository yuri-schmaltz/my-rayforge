name: Release (multi-platform)

# Master release workflow. Creates a single GitHub
# Release containing BOTH the .deb (Linux/Ubuntu)
# and .exe (Windows) artifacts.
#
# Strategy: trigger on push of a tag matching v*,
# then poll the build-deb and build-exe workflow
# runs for the same SHA until both artifacts are
# available. This is more reliable than
# workflow_run (which doesn't carry the ref that
# triggered the original workflow, and the
# artifacts from the triggering run are not
# available via the workflow_run event payload
# in a way that download-artifact can consume).
#
# Trigger:
#   - push of a tag matching v*
#
# Output:
#   - GitHub Release with .deb and .exe attached

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.3.0)"
        required: true

# Default to read-only GITHUB_TOKEN. The
# wait-for-artifacts job only needs to read
# workflows and download artifacts (OIDC, not
# contents API). The 'release' job opts in to
# write access at the job level for the
# softprops step.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-artifacts:
    name: Wait for build artifacts
    runs-on: ubuntu-24.04
    # The build-deb and build-exe workflows also
    # trigger on this same push (their on:push.tags
    # config). They run in parallel; we poll the
    # workflow runs for the same SHA until both
    # build jobs have uploaded their artifacts.
    #
    # We use 'gh run list' + 'gh run download'
    # to find and download the artifacts. This
    # is more robust than actions/download-artifact
    # with a specific run-id (we don't always know
    # the run-id of the parallel build workflows).
    steps:
      - name: Checkout the tag's commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine the tag and SHA
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          SHA="$(git rev-parse ${TAG}^{commit})"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG} sha=${SHA} version=${VERSION}"

      - name: Wait for build workflows
        # Poll the workflow runs for this SHA until
        # both build-deb and build-exe are completed.
        # 90 retries × 30s = 45 min total wait.
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          echo "Waiting for build-deb + build-exe to complete for SHA ${SHA}..."
          for i in $(seq 1 90); do
            echo "--- attempt ${i}/30 ---"
            DEB_STATUS=$(gh run list \
              --workflow="Build .deb package" \
              --json status,conclusion,headSha \
              --jq ".[] | select(.headSha == \"${SHA}\") | .status + \"|\" + .conclusion" \
              | head -1)
            EXE_STATUS=$(gh run list \
              --workflow="Build Windows Executable" \
              --json status,conclusion,headSha \
              --jq ".[] | select(.headSha == \"${SHA}\") | .status + \"|\" + .conclusion" \
              | head -1)
            echo "deb_status=${DEB_STATUS} exe_status=${EXE_STATUS}"
            if [[ "${DEB_STATUS}" == "completed|success" ]] && [[ "${EXE_STATUS}" == "completed|success" ]]; then
              echo "Both builds completed successfully"
              break
            fi
            if [[ "${DEB_STATUS}" == "completed|failure" ]] || [[ "${EXE_STATUS}" == "completed|failure" ]]; then
              echo "::error::A build failed; aborting release"
              exit 1
            fi
            sleep 30
          done
          # Final check after the loop
          if [[ "${DEB_STATUS}" != "completed|success" ]] || [[ "${EXE_STATUS}" != "completed|success" ]]; then
            echo "::error::Builds did not complete in 15 min; aborting"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download .deb artifact
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          mkdir -p dist
          RUN_ID=$(gh run list \
            --workflow="Build .deb package" \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"${SHA}\") | .databaseId" \
            | head -1)
          echo "Downloading .deb from run ${RUN_ID}..."
          gh run download "${RUN_ID}" \
            --name "pires-forge-${{ steps.meta.outputs.version }}-ubuntu24.04.deb" \
            --dir dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows installer
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          RUN_ID=$(gh run list \
            --workflow="Build Windows Executable" \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"${SHA}\") | .databaseId" \
            | head -1)
          echo "Downloading .exe from run ${RUN_ID}..."
          gh run download "${RUN_ID}" \
            --name "pires-forge-v${{ steps.meta.outputs.version }}-installer.zip" \
            --dir dist/ 2>&1 || gh run download "${RUN_ID}" \
            --name "pires-forge-v*-installer.zip" \
            --dir dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both artifacts downloaded
        id: verify
        run: |
          set -e
          echo "--- dist/ contents ---"
          ls -la dist/
          DEB_COUNT=$(find dist/ -name "*.deb" 2>/dev/null | wc -l)
          EXE_COUNT=$(find dist/ -name "*.zip" -o -name "*.exe" 2>/dev/null | wc -l)
          echo "deb_count=${DEB_COUNT} exe_count=${EXE_COUNT}"
          if [ "${DEB_COUNT}" -ge 1 ] && [ "${EXE_COUNT}" -ge 1 ]; then
            echo "ready=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "ready=false" | tee -a "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload combined artifacts
        if: steps.verify.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.meta.outputs.tag }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: wait-for-artifacts
    if: needs.wait-for-artifacts.outputs.ready == 'true'
    # softprops/action-gh-release needs write
    # access to create a Release and attach files.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download combined artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.wait-for-artifacts.outputs.tag }}
          path: dist/

      - name: Determine release type
        id: release_info
        shell: bash
        run: |
          TAG="${{ needs.wait-for-artifacts.outputs.tag }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.wait-for-artifacts.outputs.tag }}
          name: "${{ needs.wait-for-artifacts.outputs.tag }}"
          body: |
            ## What's new in ${{ needs.wait-for-artifacts.outputs.tag }}

            See the commit log since the previous tag for the full list of changes.

            ## Downloads

            - **Linux (.deb)**: attached as `rayforge-${{ steps.release_info.outputs.version }}-ubuntu24.04.deb`
              Install with `sudo dpkg -i rayforge-${{ steps.release_info.outputs.version }}-ubuntu24.04.deb`
            - **Windows (.exe)**: attached as `pires-forge-v${{ steps.release_info.outputs.version }}-installer.exe`
              Run the installer

            ## Verification

            ```
            pires-forge --version
            ```

            Report issues at https://github.com/yuri-schmaltz/pires-forge/issues
          files: dist/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
