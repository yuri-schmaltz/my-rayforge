name: Security and Performance Gates

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # SCA – Software Composition Analysis
  # Scans Python dependencies for known vulnerabilities using pip-audit.
  # Fails the build if any vulnerability with fix available is found.
  # ------------------------------------------------------------------
  sca:
    name: Dependency Vulnerability Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout raygeo source
        uses: actions/checkout@v6
        with:
          repository: barebaric/raygeo
          path: external/raygeo

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1
          cache: true
          cache-key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - name: Setup environment
        run: pixi install

      - name: Install pip-audit
        # ``pip-audit`` is now declared as a pypi-dep in the
        # ``[feature.test.pypi-dependencies]`` block of
        # ``pixi.toml``, so the prior ``pixi install`` step already
        # pulled it into the pixi env. Running it via ``pixi run``
        # is the supported way to invoke a tool that lives in the
        # pixi env.
        #
        # The previous version of this step tried
        # ``pixi run python -m pip install pip-audit --quiet``,
        # which fails because pixi's default env does not bundle
        # ``pip`` (pixi uses ``uv`` internally for PyPI
        # resolution).
        run: pixi run pip-audit --version

      - name: Run pip-audit (SCA)
        run: |
          pixi run pip-audit \
            --requirement requirements.txt \
            --format markdown \
            --output pip-audit-report.md \
            --progress-spinner off || true
          # Show report in CI log
          if [ -f pip-audit-report.md ]; then
            cat pip-audit-report.md
          fi
          # Hard-fail on vulnerabilities that have a known fix
          pixi run pip-audit \
            --requirement requirements.txt \
            --fix --dry-run \
            --progress-spinner off

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.md
          retention-days: 30

  # ------------------------------------------------------------------
  # Performance Gate – module import time
  # Measures the time to import the rayforge package in headless mode
  # and fails if it exceeds the threshold (30 s budget).
  # The threshold is intentionally generous to avoid flaky failures;
  # adjust downward as startup is optimised.
  # ------------------------------------------------------------------
  perf-import:
    name: Import Time Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout raygeo source
        uses: actions/checkout@v6
        with:
          repository: barebaric/raygeo
          path: external/raygeo

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1
          cache: true
          cache-key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - name: Setup environment
        run: pixi install

      - name: Compile Translations
        run: pixi run compile-translations

      - name: Measure rayforge import time
        run: |
          # Measure wall-clock time of a cold import in headless mode.
          # RAYFORGE_CONFIG_DIR is set to a temp dir so no user state is read.
          RAYFORGE_CONFIG_DIR=/tmp/rayforge_perf_test \
          pixi run python -c "
          import time, sys
          t0 = time.perf_counter()
          import rayforge
          from rayforge.config import CONFIG_DIR
          from rayforge.context import get_context
          t1 = time.perf_counter()
          elapsed = t1 - t0
          threshold = 30.0  # seconds
          print(f'Import time: {elapsed:.2f}s (threshold: {threshold}s)')
          if elapsed > threshold:
              print(f'FAIL: import time {elapsed:.2f}s exceeds {threshold}s')
              sys.exit(1)
          print('PASS')
          "

      - name: Save performance baseline
        if: always()
        run: |
          mkdir -p perf-results
          echo "{\"job\": \"import-time\", \"sha\": \"${{ github.sha }}\", \"ref\": \"${{ github.ref }}\"}" \
            > perf-results/meta.json

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.run_id }}
          path: perf-results/
          retention-days: 90
