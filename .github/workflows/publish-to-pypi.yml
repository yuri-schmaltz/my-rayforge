name: Build and Publish Wheel

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

# Default to read-only GITHUB_TOKEN. The build-publish-wheel job
# opts in to `id-token: write` at the job level (required for PyPI
# Trusted Publishing via OIDC). The lint-test job is a workflow_call
# into lint-test.yml, which has its own default of `contents: read`.
# Closes CodeQL alert "Workflow does not contain permissions".
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-test:
    uses: ./.github/workflows/lint-test.yml

  build-publish-wheel:
    name: Build and Publish Wheel
    needs: [lint-test]  # Run only if tests pass
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest
          frozen: true

      - name: Build wheel with Pixi
        run: |
          pixi run --frozen wheel

      - name: Publish package distributions to PyPI
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'yuri-schmaltz/pires-forge'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
