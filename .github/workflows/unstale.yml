name: Unmark issues and pull requests as stale on activity
on:
  issue_comment:
    types: [created]

# The `remove-stale-label` job declares `issues: write` +
# `pull-requests: write` at the job level (required to remove the
# stale label via `gh issue edit`). The workflow-level default is
# `contents: read` so the only write surface is what the job
# explicitly requests. Closes CodeQL alert "Workflow does not
# contain permissions".
permissions:
  contents: read

jobs:
  remove-stale-label:
    if: github.repository == 'yuri-schmaltz/pires-forge'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove stale label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit ${{ github.event.issue.number }} --remove-label "stale" -R ${{ github.repository }}
