<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Pires Forge — Application icon (vector / scalable).

  Design: "Spark burst" — a bright laser hit moment captured as
  a radial spark explosion. Black rounded-square background, a
  central white/yellow flash, and red/orange/yellow laser-spark
  rays radiating outward.

  The full-color / high-resolution raster version is in
  org.piresforge.pires-forge.png (2048x2048, generated by
  image_synthesize). This SVG is the vector sibling used by
  Linux desktop environments (hicolor/scalable/apps/) and
  derived into the macOS .icns and Windows .ico by the
  platform build scripts.

  Coordinate system: 512x512 viewBox (matches the raster
  output). Center is at (256, 256). Rays are drawn from the
  center outward. The rounded-square background is achieved
  via a clipPath with rx=96 (matches the macOS-style
  "squircle" radius).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     role="img" aria-label="Pires Forge application icon">

  <title>Pires Forge</title>
  <desc>Application icon: a spark burst representing a laser strike on a workpiece.</desc>

  <defs>
    <!-- Rounded-square background mask (squircle-like, r=96) -->
    <clipPath id="appIconClip">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>

    <!-- Radial gradient: white-hot center to yellow-orange halo -->
    <radialGradient id="sparkCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%"  stop-color="#fff4a3" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#ffb000" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear gradient for spark rays: hot center to fading tip -->
    <linearGradient id="rayGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffeb3b"/>
      <stop offset="50%"  stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#d32f2f" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Everything is clipped to the rounded-square background -->
  <g clip-path="url(#appIconClip)">

    <!-- Deep black background -->
    <rect x="0" y="0" width="512" height="512" fill="#0a0a0a"/>

    <!-- Subtle radial darkening to add depth (very faint) -->
    <rect x="0" y="0" width="512" height="512" fill="url(#sparkCore)" opacity="0.06"/>

    <!-- 12 spark rays radiating from center, alternating length/width.
         Drawn as thin tapered shapes; tip is at the outer edge of
         the icon, base is at center. Rotated 0..330 degrees. -->
    <g transform="translate(256 256)" fill="url(#rayGradient)">
      <!-- 0 deg: long, bright -->
      <polygon points="0,-10 0,10 240,2 240,-2" transform="rotate(0)"/>
      <!-- 30 deg: short -->
      <polygon points="0,-6 0,6 150,1.5 150,-1.5" transform="rotate(30)" opacity="0.75"/>
      <!-- 60 deg: long -->
      <polygon points="0,-8 0,8 220,2 220,-2" transform="rotate(60)"/>
      <!-- 90 deg: short -->
      <polygon points="0,-5 0,5 130,1.5 130,-1.5" transform="rotate(90)" opacity="0.7"/>
      <!-- 120 deg: long -->
      <polygon points="0,-8 0,8 220,2 220,-2" transform="rotate(120)"/>
      <!-- 150 deg: short -->
      <polygon points="0,-6 0,6 150,1.5 150,-1.5" transform="rotate(150)" opacity="0.75"/>
      <!-- 180 deg: long -->
      <polygon points="0,-10 0,10 240,2 240,-2" transform="rotate(180)"/>
      <!-- 210 deg: short -->
      <polygon points="0,-6 0,6 150,1.5 150,-1.5" transform="rotate(210)" opacity="0.75"/>
      <!-- 240 deg: long -->
      <polygon points="0,-8 0,8 220,2 220,-2" transform="rotate(240)"/>
      <!-- 270 deg: short -->
      <polygon points="0,-5 0,5 130,1.5 130,-1.5" transform="rotate(270)" opacity="0.7"/>
      <!-- 300 deg: long -->
      <polygon points="0,-8 0,8 220,2 220,-2" transform="rotate(300)"/>
      <!-- 330 deg: short -->
      <polygon points="0,-6 0,6 150,1.5 150,-1.5" transform="rotate(330)" opacity="0.75"/>
    </g>

    <!-- Diagonal laser beam crossing through the center (the "incident"
         beam that triggered the spark). Drawn as a thin red line
         with a bright cyan-white core. Tilted 30 deg. -->
    <g transform="translate(256 256) rotate(30)">
      <!-- Outer red glow -->
      <rect x="-260" y="-7" width="520" height="14" fill="#d32f2f" opacity="0.55"/>
      <!-- Inner orange -->
      <rect x="-260" y="-4" width="520" height="8" fill="#ff9800" opacity="0.8"/>
      <!-- Hot core -->
      <rect x="-260" y="-1.5" width="520" height="3" fill="#fff4a3"/>
      <!-- White-hot center -->
      <rect x="-260" y="-0.6" width="520" height="1.2" fill="#ffffff"/>
    </g>

    <!-- Central spark ball: layered circles for hot-core effect -->
    <circle cx="256" cy="256" r="48" fill="#ffb000" opacity="0.55"/>
    <circle cx="256" cy="256" r="28" fill="#fff4a3"/>
    <circle cx="256" cy="256" r="16" fill="#ffffff"/>

    <!-- A few small detached spark dots at the ends of rays -->
    <g fill="#ffeb3b" opacity="0.85">
      <circle cx="256" cy="40"  r="5"/>
      <circle cx="472" cy="256" r="4"/>
      <circle cx="256" cy="472" r="5"/>
      <circle cx="40"  cy="256" r="4"/>
      <!-- Diagonals -->
      <circle cx="406" cy="106" r="3"/>
      <circle cx="406" cy="406" r="3"/>
      <circle cx="106" cy="406" r="3"/>
      <circle cx="106" cy="106" r="3"/>
    </g>
  </g>
</svg>
