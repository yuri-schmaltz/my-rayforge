---
# Flatpak manifest for rayforge-fork.
#
# This is a template. To build:
#   1. Edit `url` to point to the latest release tarball
#   2. Update `sha256` (download the tarball, run sha256sum)
#   3. Build: flatpak-builder --repo=rayforge-repo build-dir org.rayforge.rayforge-fork.yaml
#   4. Install: flatpak install --user rayforge-repo org.rayforge.rayforge-fork
#   5. Run: flatpak run org.rayforge.rayforge-fork
#
# For Flathub submission:
#   - Rename to org.rayforge.rayforge-fork (matches the AUR name)
#   - Use a single-file manifest
#   - Add the runtime-only modules: nothing extra needed; base is GNOME 47
#   - The fork's main code is Python, so the build is mostly:
#     download tarball -> run pixi run -e build install -> bundle

app-id: org.rayforge.rayforge-fork
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-version: "47"
command: rayforge

finish-args:
  # Serial port access for laser cutters
  - --device=dri
  # Home directory access for projects
  - --filesystem=home
  # Network access (OctoPrint, etc.)
  - --share=network
  # Wayland socket
  - --socket=wayland
  # X11 socket (fallback for older compositors)
  - --socket=x11
  # PulseAudio for sound notifications
  - --socket=pulseaudio
  # Removable media for reading designs from USB
  - --filesystem=removable
  # D-Bus session for inter-app communication
  - --socket=session-bus
  # system-bus for hardware access (alternative to --device)
  - --socket=system-bus

modules:
  - name: pixi
    buildsystem: simple
    build-commands:
      - install -Dm755 pixi /app/bin/pixi
    sources:
      - type: archive
        url: https://github.com/prefix-dev/pixi/releases/download/v0.41.4/pixi-x86_64-unknown-linux-musl.tar.gz
        sha256: REPLACE_WITH_PIXI_SHA256
        only-arches:
          - x86_64

  - name: rayforge
    buildsystem: simple
    build-commands:
      # Copy the source
      - cp -r . /app/src/rayforge
      - cd /app/src/rayforge
      # Install via pixi
      - /app/bin/pixi install --frozen
      # Build the wheel
      - /app/bin/pixi run -e build python -m build --wheel
      # Install the wheel into the flatpak's Python
      - pip install --no-index --find-links=dist/ rayforge*.whl
      # Compile .mo files
      - /app/bin/pixi run -e build compile-translations
      - cp -r locale /app/share/locale
      # Install the icon
      - install -Dm644 rayforge/resources/icons/rayforge.svg /app/share/icons/hicolor/scalable/apps/org.rayforge.rayforge.svg
      # Install the .desktop file
      - install -Dm644 rayforge/resources/rayforge.desktop /app/share/applications/org.rayforge.rayforge.desktop
      # Wrap the binary
      - install -Dm755 /app/bin/pixi /app/bin/rayforge
      - |
        cat > /app/bin/rayforge.real << 'EOF'
        #!/bin/sh
        exec /app/bin/pixi run -e build /app/src/rayforge/.pixi/envs/build/bin/rayforge "$@"
        EOF
      - chmod +x /app/bin/rayforge.real
      - mv /app/bin/rayforge /app/bin/rayforge.bak
      - mv /app/bin/rayforge.real /app/bin/rayforge
    sources:
      - type: archive
        url: https://github.com/yuri-schmaltz/rayforge/archive/refs/tags/1.9.0+resilience.5.tar.gz
        sha256: REPLACE_WITH_RAYFORGE_SHA256
        dest: .

  - name: cleanup
    buildsystem: simple
    build-commands:
      # Remove the pixi build env (saves ~2 GB)
      - rm -rf /app/src/rayforge/.pixi/envs
    build-when: never
