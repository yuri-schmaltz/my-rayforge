site_name: Pires Forge
site_description: A desktop application for laser cutting and engraving
site_author: Yuri Schmaltz

docs_dir: .
site_dir: site

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - User Manual: USER_MANUAL.md
  - Developer Guide: DEVELOPER_GUIDE.md
  - Roadmap & History: ROADMAP.md
  - Process Journal: PROCESS_JOURNAL.md
  - Changelog: CHANGELOG.md
  - Support: SUPPORT.md
  - Contributing: CONTRIBUTING.md
  - License: LICENSE

extra:
  generator: false
